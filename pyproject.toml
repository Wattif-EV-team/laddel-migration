[project]
name = "laddel-migration"
version = "0.1.0"
description = "Project for migrating data from source to target system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.16.0",
    "python-dotenv>=1.1.0",
    "pymysql>=1.1.1",
]

[project.scripts]
ladmig = "laddel_migration.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laddel_migration"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
